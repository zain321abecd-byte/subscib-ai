services:
  - type: web
    name: subscribai-api
    runtime: node
    repo: https://github.com/zain321abecd-byte/subscib-ai
    branch: main
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://subscribai.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://subscribai.com
      - key: SITE_URL
        value: https://subscribai.com
      - key: PAYFAST_PUBLIC_API_URL
        value: https://api.subscribai.com
      - key: API_URL
        value: https://api.subscribai.com
      - key: PAYFAST_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: CRON_SECRET
        sync: false
      # ---- Server-to-server token (admin Server Actions -> this API) ----
      # Must match INTERNAL_API_TOKEN in the frontend env, or /emails/* and
      # /delivery/* reject the admin panel with 401.
      - key: INTERNAL_API_TOKEN
        sync: false
      # ---- WhatsApp (subscription delivery automation) ----
      # Blank/unset => manual mode: messages are rendered + logged and the admin
      # fires them from WhatsApp Web. Set the Cloud API pair (or a custom
      # gateway URL) to send automatically. See ADMIN_SETUP.md.
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_CUSTOM_URL
        sync: false
      - key: WHATSAPP_CUSTOM_TOKEN
        sync: false
      # ---- Delivery automation behaviour ----
      - key: DELIVERY_DUPLICATE_WINDOW_MINUTES
        value: "10"
      - key: DELIVERY_REMINDER_DAYS_BEFORE
        value: "3"
      - key: DELIVERY_DEFAULT_LANGUAGE
        value: en
      - key: DELIVERY_REMINDERS_ENABLED
        value: "true"
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_NAME
        sync: false
      - key: PAYFAST_SECURED_KEY
        sync: false
      - key: PAYFAST_CURRENCY
        sync: false
